name: Finalize ODOCH logo rendering

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-logo-fix"
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          for i in {1..30}; do
            RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=10" --jq ".workflow_runs[] | select(.head_sha==\"$SHA\") | {id,status,conclusion} | @json" | head -n 1 || true)
            echo "Pages run: $RUN"
            if echo "$RUN" | grep -q '\"status\":\"completed\"'; then
              if echo "$RUN" | grep -q '\"conclusion\":\"success\"'; then exit 0; fi
              echo "Pages build failed"; exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Pages build"; exit 1

      - name: Get Pages run ID
        id: pages_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=10" --jq '.workflow_runs[] | select(.head_sha=="${{ github.sha }}") | .id' | head -n 1)
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download and extract Pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf site
          mkdir -p site
          gh run download "${{ steps.pages_run.outputs.id }}" --repo "${{ github.repository }}" --name github-pages --dir site
          TAR=$(find site -type f -name '*.tar' -print -quit)
          test -n "$TAR"
          mkdir -p extracted
          tar -xf "$TAR" -C extracted
          rm -rf site
          mv extracted site
          INDEX=$(find site -type f -name index.html -print -quit)
          test -n "$INDEX"
          ROOT=$(dirname "$INDEX")
          echo "SITE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Pages site root: $ROOT"

      - name: Correct logo and desktop navigation rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['SITE_ROOT'])
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')

          s = s.replace('.brandlink img{height:92px;width:auto;display:block}', '.brandlink img{height:46px;width:auto;display:block}')
          s = s.replace('.brandlink img{height:104px}', '.brandlink img{height:52px}')

          old_nav = '''<ul class="dnav" aria-label="Main"><li><a href="#about">About</a><a href="#mba-leadership">MBA leadership</a></li><li><a href="#mba-leadership">MBA leadership</a><a href="#services">Services</a></li><li><a href="#packages">Packages</a></li><li><a href="#work">Work</a></li><li><a href="#impact">Impact</a><a href="#roots">Roots &amp; service</a></li><li><a href="#contact">Contact</a></li><li><a href="https://github.com/odoema" rel="noopener">GitHub</a></li></ul>'''
          new_nav = '''<ul class="dnav" aria-label="Main"><li><a href="#about">About</a></li><li><a href="#mba-leadership">MBA leadership</a></li><li><a href="#services">Services</a></li><li><a href="#packages">Packages</a></li><li><a href="#work">Work</a></li><li><a href="#impact">Impact</a></li><li><a href="#roots">Roots &amp; service</a></li><li><a href="#contact">Contact</a></li><li><a href="https://github.com/odoema" rel="noopener">GitHub</a></li></ul>'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)
          elif 'aria-label="Main"' not in s:
              raise SystemExit('Desktop navigation markup not found')

          nav_css = '''
          /* Final ODOCH desktop navigation fix */
          @media (min-width:960px){
            .appbar .wrap{gap:24px}
            .dnav{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex:1;min-width:0}
            .dnav li{display:flex;align-items:center;list-style:none;margin:0;padding:0}
            .dnav a{display:inline-flex;align-items:center;justify-content:center;padding:8px 9px;min-height:40px;white-space:nowrap;font-size:.92rem;line-height:1.2;border-radius:8px}
          }
          '''
          if '/* Final ODOCH desktop navigation fix */' not in s:
              s = s.replace('</style>', nav_css + '\n</style>', 1)

          logo_css = '''
          /* Final ODOCH logo rendering fix */
          .brandlink{width:108px;height:46px;min-width:108px;min-height:46px;flex:0 0 108px;overflow:hidden;display:flex;align-items:center;justify-content:center;line-height:0;transform:translateZ(0)}
          .brandlink img{display:block;width:108px;height:46px;max-width:none;flex:0 0 108px;object-fit:contain;object-position:center;aspect-ratio:108/46}
          @media (min-width:960px){.brandlink{width:122px;height:52px;min-width:122px;min-height:52px;flex-basis:122px}.brandlink img{width:122px;height:52px;flex-basis:122px}}
          @media (prefers-reduced-motion:reduce){.brandlink,.brandlink img{transition:none!important}}
          '''
          if '/* Final ODOCH logo rendering fix */' not in s:
              s = s.replace('</style>', logo_css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify final logo and desktop navigation
        run: |
          grep -q 'Final ODOCH logo rendering fix' "$SITE_ROOT/index.html"
          grep -q 'Final ODOCH desktop navigation fix' "$SITE_ROOT/index.html"
          grep -q 'height:46px' "$SITE_ROOT/index.html"
          grep -q 'height:52px' "$SITE_ROOT/index.html"
          grep -q '<li><a href="#about">About</a></li>' "$SITE_ROOT/index.html"
          test "$(grep -o 'MBA leadership' "$SITE_ROOT/index.html" | wc -l)" -eq 1

      - name: Upload corrected Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_ROOT }}

      - name: Deploy corrected Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
