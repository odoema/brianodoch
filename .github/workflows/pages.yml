name: Deploy ODOCH website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build premium ODOCH presentation layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Keep the embedded source logo, but render it at the requested larger size.
          s = s.replace('.brandlink img{height:46px;width:auto;display:block}', '.brandlink img{height:92px;width:auto;display:block}')
          s = s.replace('.brandlink img{height:52px}', '.brandlink img{height:104px}')

          premium_css = r'''
          /* ODOCH Premium Executive UI Layer */
          :root{
            --luxury:#071b33;
            --luxury-2:#0b3158;
            --gold:#c9a45c;
            --gold-soft:#ead8ad;
            --glass:rgba(255,255,255,.72);
            --shadow-soft:0 18px 55px rgba(2,41,82,.10);
            --shadow-deep:0 30px 90px rgba(2,41,82,.20);
          }
          html{scroll-behavior:smooth}
          body{background:#fbfcfe}
          body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.035;background-image:radial-gradient(rgba(2,41,82,.8) .6px,transparent .6px);background-size:5px 5px;mix-blend-mode:multiply}
          .appbar{background:rgba(251,252,254,.78);border-bottom-color:rgba(219,228,238,.7);box-shadow:0 8px 30px rgba(2,41,82,.035);transition:height .35s ease,background .35s ease,box-shadow .35s ease}
          .appbar.scrolled{background:rgba(255,255,255,.92);box-shadow:0 12px 38px rgba(2,41,82,.10)}
          .appbar .wrap{transition:height .35s ease}
          .appbar.scrolled .wrap{height:62px}
          .brandlink{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
          .brandlink:hover{transform:translateY(-1px) scale(1.015)}
          .brandlink img{filter:drop-shadow(0 7px 16px rgba(2,41,82,.12));transition:height .35s ease,filter .35s ease}
          .appbar.scrolled .brandlink img{filter:drop-shadow(0 5px 12px rgba(2,41,82,.10))}
          .dnav a{position:relative;transition:color .25s ease,background .25s ease,transform .25s ease}
          .dnav a::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));transform:scaleX(0);transform-origin:center;transition:transform .3s ease}
          .dnav a:hover{transform:translateY(-1px)}
          .dnav a:hover::after,.dnav a[aria-current]::after{transform:scaleX(1)}
          .hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#021c39 0%,#022952 48%,#063b67 100%);min-height:min(760px,calc(100vh - 72px));display:flex;align-items:center}
          .hero::before{content:"";position:absolute;width:58vw;height:58vw;max-width:760px;max-height:760px;right:-18%;top:-35%;border-radius:50%;background:radial-gradient(circle,rgba(2,165,58,.20) 0%,rgba(2,165,58,.07) 38%,transparent 70%);filter:blur(4px);animation:orbFloat 12s ease-in-out infinite alternate;z-index:-1}
          .hero::after{content:"";position:absolute;width:70vw;height:70vw;max-width:900px;max-height:900px;left:-35%;bottom:-60%;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.14),transparent 65%);animation:orbFloat 16s ease-in-out infinite alternate-reverse;z-index:-1}
          @keyframes orbFloat{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,4%,0) scale(1.08)}}
          .hero .wrap{position:relative}
          .herogrid>div:first-child{animation:heroIn .9s cubic-bezier(.16,1,.3,1) both}
          .portrait{animation:portraitIn 1.1s .12s cubic-bezier(.16,1,.3,1) both;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 25px 70px rgba(0,0,0,.28);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease}
          .portrait:hover{transform:translateY(-8px) scale(1.025);box-shadow:0 0 0 12px rgba(255,255,255,.08),0 35px 90px rgba(0,0,0,.34)}
          .brandcard{border:1px solid rgba(255,255,255,.6);box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateZ(0);transition:transform .45s ease,box-shadow .45s ease}
          .brandcard:hover{transform:translateY(-5px);box-shadow:0 28px 80px rgba(0,0,0,.24)}
          .role{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);color:#eaf3fb;letter-spacing:.03em}
          .btn{position:relative;overflow:hidden;transform:translateZ(0);box-shadow:0 8px 22px rgba(2,165,58,.14);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,background .28s ease,color .28s ease}
          .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.34) 48%,transparent 70%);transform:translateX(-120%);transition:transform .65s ease}
          .btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(2,165,58,.22)}
          .btn:hover::before{transform:translateX(120%)}
          .btn:active{transform:translateY(-1px) scale(.985)}
          .btn.alt{box-shadow:none;background:rgba(255,255,255,.025);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
          section{position:relative}
          section:not(.hero) .wrap{position:relative}
          section:not(.hero) h2{letter-spacing:-.035em}
          h2::after{width:0;transition:width .7s cubic-bezier(.16,1,.3,1)}
          section.revealed h2::after{width:72px}
          .card{position:relative;overflow:hidden;border-top:1px solid var(--line);box-shadow:0 2px 0 rgba(2,41,82,.01);transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s ease,border-color .35s ease,background .35s ease}
          .card::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--green),var(--gold));transform:scaleX(.25);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
          .card::after{content:"";position:absolute;width:160px;height:160px;right:-90px;bottom:-100px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.12),transparent 70%);transition:transform .5s ease}
          button.card:hover{transform:translateY(-8px);box-shadow:var(--shadow-soft);border-color:#cbd8e5;background:linear-gradient(180deg,#fff,#fbfdff)}
          button.card:hover::before{transform:scaleX(1)}
          button.card:hover::after{transform:scale(1.4)}
          button.card h3{transition:color .3s ease,transform .3s ease}
          button.card:hover h3{color:var(--luxury-2);transform:translateX(2px)}
          .more{display:inline-flex;align-items:center;gap:6px;transition:gap .3s ease,color .3s ease}
          button.card:hover .more{gap:10px;color:#016d28}
          .pill li{transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease}
          .pill li:hover{transform:translateY(-2px);background:#f7fbff;border-color:#b8cadd;box-shadow:0 8px 18px rgba(2,41,82,.07)}
          .facts div{transition:padding-left .3s ease,border-color .3s ease}
          .facts div:hover{padding-left:8px;border-color:var(--green)}
          .value{position:relative;padding-left:22px}
          .value::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:3px;border-radius:99px;background:linear-gradient(var(--green),var(--gold))}
          .contact{position:relative;overflow:hidden;background:linear-gradient(135deg,#021a34,#022952 60%,#063b67)}
          .contact::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 75% 40%,rgba(201,164,92,.13),transparent 26%),radial-gradient(circle at 20% 80%,rgba(2,165,58,.10),transparent 30%);animation:contactGlow 14s ease-in-out infinite alternate}
          @keyframes contactGlow{from{transform:scale(1)}to{transform:scale(1.08) rotate(2deg)}}
          .contact .wrap{position:relative}
          .contact a.big{transition:color .3s ease,text-shadow .3s ease}
          .contact a.big:hover{color:#f5ead1;text-shadow:0 0 24px rgba(201,164,92,.22)}
          footer{background:#f8fafc}
          dialog{opacity:0;transform:translateY(18px) scale(.985);transition:opacity .28s ease,transform .35s cubic-bezier(.16,1,.3,1);border:1px solid rgba(219,228,238,.8);box-shadow:0 35px 100px rgba(2,41,82,.28)}
          dialog[open]{opacity:1;transform:none}
          dialog::backdrop{background:rgba(2,18,38,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
          .dh{background:linear-gradient(135deg,#021c39,#022952);border-bottom:1px solid rgba(255,255,255,.10)}
          .da .btn{box-shadow:0 10px 24px rgba(2,41,82,.16)}
          .da .btn.alt{box-shadow:none}
          .scroll-progress{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--green),var(--gold));z-index:10000;box-shadow:0 0 12px rgba(2,165,58,.35);pointer-events:none}
          .luxury-cursor{position:fixed;width:180px;height:180px;border-radius:50%;pointer-events:none;z-index:9998;background:radial-gradient(circle,rgba(2,165,58,.07),transparent 65%);transform:translate(-50%,-50%);opacity:0;transition:opacity .25s ease;mix-blend-mode:multiply}
          .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.16,1,.3,1)}
          .reveal.in{opacity:1;transform:none}
          .stagger>*{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1)}
          .stagger.in>*{opacity:1;transform:none}
          .stagger.in>*:nth-child(2){transition-delay:.05s}.stagger.in>*:nth-child(3){transition-delay:.1s}.stagger.in>*:nth-child(4){transition-delay:.15s}.stagger.in>*:nth-child(5){transition-delay:.2s}.stagger.in>*:nth-child(6){transition-delay:.25s}.stagger.in>*:nth-child(7){transition-delay:.3s}.stagger.in>*:nth-child(8){transition-delay:.35s}
          @keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
          @keyframes portraitIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
          @media (min-width:960px){.hero{padding-top:76px;padding-bottom:92px}.herogrid{gap:80px}.portrait{width:clamp(260px,28vw,360px)}.brandcard{width:min(100%,560px)}.luxury-cursor{display:block}}
          @media (max-width:959px){.luxury-cursor{display:none}}
          @media (prefers-reduced-motion:reduce){.hero::before,.hero::after,.contact::before{animation:none}.reveal,.stagger>*{opacity:1;transform:none;transition:none}.luxury-cursor{display:none!important}}
          '''

          # Add premium CSS immediately before the existing closing style tag.
          if '/* ODOCH Premium Executive UI Layer */' not in s:
              s = s.replace('</style>', premium_css + '\n</style>', 1)

          # Upgrade metadata and add structured data without disturbing the existing page copy.
          seo = r'''
          <link rel="canonical" href="https://brianodoch.com/">
          <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
          <meta name="author" content="Brian Odoch Emmanuel">
          <meta name="keywords" content="Brian Odoch Emmanuel, technology consultant Uganda, data scientist Uganda, AI consultant Uganda, financial engineering Uganda, business development consultant Uganda, digital transformation Africa, software development Uganda, financial analytics Uganda">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://brianodoch.com/">
          <meta property="og:title" content="Brian Odoch Emmanuel | Technology, Data, Finance & Business Strategy">
          <meta property="og:description" content="Brian Odoch combines technology, data, finance and business strategy to build practical solutions for organizations, founders and investors across Uganda and Africa.">
          <meta property="og:site_name" content="Brian Odoch Emmanuel">
          <meta property="og:locale" content="en_UG">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="Brian Odoch Emmanuel | Technology, Data, Finance & Business Strategy">
          <meta name="twitter:description" content="Technology, data, finance and business strategy for practical growth and digital transformation in Uganda and Africa.">
          <script type="application/ld+json">
          {
            "@context":"https://schema.org",
            "@graph":[
              {"@type":"Person","@id":"https://brianodoch.com/#person","name":"Brian Odoch Emmanuel","url":"https://brianodoch.com/","email":"mailto:sales@brianodoch.com","jobTitle":"Technology, Data, Finance & Business Development Consultant","description":"Ugandan technology, data, finance and business-development professional helping organizations turn complex operational problems into practical digital and analytical solutions.","nationality":{"@type":"Country","name":"Uganda"},"sameAs":["https://github.com/odoema"],"knowsAbout":["Software development","Data science","Artificial intelligence","Machine learning","Financial engineering","Financial analytics","Business development","Digital transformation","Research and monitoring and evaluation","E-commerce","Supply-chain technology"]},
              {"@type":"WebSite","@id":"https://brianodoch.com/#website","url":"https://brianodoch.com/","name":"Brian Odoch Emmanuel","publisher":{"@id":"https://brianodoch.com/#person"},"inLanguage":"en-UG"},
              {"@type":"ProfessionalService","@id":"https://brianodoch.com/#service","name":"Brian Odoch — Technology, Data, Finance & Business Development","url":"https://brianodoch.com/","provider":{"@id":"https://brianodoch.com/#person"},"areaServed":["Uganda","East Africa","Africa"],"serviceType":["Technology consulting","Software development","Data analytics","AI and machine learning","Financial analytics","Digital transformation","Business development"]}
            ]
          }
          </script>
          '''
          if 'Brian Odoch Emmanuel | Technology, Data, Finance & Business Strategy' not in s:
              s = s.replace('</head>', seo + '\n</head>', 1)

          premium_js = r'''
          <script>
          (function(){
            var body=document.body, bar=document.querySelector('.appbar');
            var progress=document.createElement('div'); progress.className='scroll-progress'; body.appendChild(progress);
            var cursor=document.createElement('div'); cursor.className='luxury-cursor'; body.appendChild(cursor);
            var lastY=0, ticking=false;
            function paint(){
              var max=document.documentElement.scrollHeight-innerHeight;
              progress.style.width=(max>0?(scrollY/max)*100:0)+'%';
              if(bar) bar.classList.toggle('scrolled',scrollY>18);
              ticking=false;
            }
            window.addEventListener('scroll',function(){lastY=scrollY;if(!ticking){requestAnimationFrame(paint);ticking=true;}},{passive:true}); paint();
            if(window.matchMedia('(pointer:fine)').matches){
              window.addEventListener('mousemove',function(e){cursor.style.opacity='1';cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'},{passive:true});
              document.addEventListener('mouseleave',function(){cursor.style.opacity='0'});
            }
            var targets=[];
            document.querySelectorAll('section').forEach(function(el){el.classList.add('reveal');targets.push(el)});
            document.querySelectorAll('.grid,.skgrid,.facts').forEach(function(el){el.classList.add('stagger');targets.push(el)});
            if('IntersectionObserver' in window){
              var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in','revealed');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
              targets.forEach(function(el){io.observe(el)});
            }else{targets.forEach(function(el){el.classList.add('in','revealed')})}
            document.querySelectorAll('.dnav a,.drawer nav a').forEach(function(a){
              a.addEventListener('click',function(){
                var id=a.getAttribute('href');if(id&&id.charAt(0)==='#'){var target=document.querySelector(id);if(target){target.style.scrollMarginTop='90px'}}
              });
            });
          })();
          </script>
          '''
          if 'className=\'scroll-progress\'' not in s:
              s = s.replace('</body>', premium_js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('Premium presentation layer applied.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
